<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/crescent-star.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Islamic OS" />
    <meta name="description" content="Personal Islamic Habit Tracker - Track Salah, Awrad, Qur'an, Islamic Habits, Tasks & Streaks" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <title>Islamic Daily OS — Personal Islamic Habit & Prayer Tracker</title>
  </head>
  <body class="bg-islamic-bg-light dark:bg-islamic-bg-dark text-slate-800 dark:text-slate-100 antialiased min-h-screen selection:bg-islamic-primary-200 selection:text-islamic-primary-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Self-healing: if an asset fails to load due to outdated PWA cache, purge cache and reload once
      window.addEventListener('error', function(e) {
        if (e && (e.target && e.target.tagName === 'SCRIPT' || (e.message && (e.message.includes('dynamically imported module') || e.message.includes('Loading chunk'))))) {
          if ('caches' in window && !sessionStorage.getItem('sw_cache_recovered')) {
            sessionStorage.setItem('sw_cache_recovered', '1');
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              window.location.reload();
            });
          }
        }
      }, true);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
          }).catch(function() {});
        });
      }
    </script>
  </body>
</html>
